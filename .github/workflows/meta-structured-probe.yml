name: Meta structured extraction check
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model ID from the account catalog
        required: true
        type: choice
        options:
          - muse-spark-1.3
          - muse-spark-1.2
      scenario:
        description: Synthetic test scenario
        required: true
        type: choice
        options:
          - basic
          - change
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: One synthetic provider request
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_BASE_URL: https://api.meta.ai/v1
          META_TEXT_MODEL: ${{ inputs.model }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { extractTerms } from './src/server/meta.ts';
          const source = process.env.SCENARIO === 'change'
            ? 'Venue: Could we add one more set at 23:00? Musician: I need to check the fee and full schedule.'
            : 'Venue: Our fictional venue Blue Alley offers the trio $900 for sets at 20:00 and 22:00. Musician: Could you confirm the payment date?';
          try {
            const result = await extractTerms(source);
            console.log(JSON.stringify({ candidateCount: result.candidates.length, candidates: result.candidates.map(({ field, value, status }) => ({ field, value, status })), questions: result.questions.length }));
            const valid = process.env.SCENARIO === 'change'
              ? result.candidates.some(c => c.field === 'additionalSets' && c.value === '1' && c.status === 'proposed') && !result.candidates.some(c => c.field === 'feeCents')
              : result.candidates.some(c => c.field === 'feeCents' && c.value === '90000');
            if (!valid) process.exitCode = 1;
          } catch (error) {
            console.error(JSON.stringify({ error: error?.kind ?? 'unknown' }));
            process.exitCode = 1;
          }
          NODE
