name: Meta structured extraction check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: One synthetic provider request
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_BASE_URL: https://api.meta.ai/v1
          META_TEXT_MODEL: muse-spark-1.3
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { extractTerms } from './src/server/meta.ts';
          const source = 'Venue: Our fictional venue Blue Alley offers the trio $900 for sets at 20:00 and 22:00. Musician: Could you confirm the payment date?';
          try {
            const result = await extractTerms(source);
            console.log(JSON.stringify({ candidateCount: result.candidates.length, fields: result.candidates.map(c => c.field), questions: result.questions.length }));
            if (!result.candidates.some(c => c.field === 'feeCents' && c.value === '90000')) process.exitCode = 1;
          } catch (error) {
            console.error(JSON.stringify({ error: error?.kind ?? 'unknown' }));
            process.exitCode = 1;
          }
          NODE
