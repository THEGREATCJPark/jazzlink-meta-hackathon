name: Meta model catalog
on: workflow_dispatch
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: List model IDs available to the account
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch('https://api.meta.ai/v1/models', { headers: { Authorization: `Bearer ${process.env.MODEL_API_KEY}` }, signal: AbortSignal.timeout(30000) });
            if (!response.ok) { console.error(`HTTP ${response.status}`); process.exitCode = 1; return; }
            const payload = await response.json();
            const ids = (payload.data ?? []).map(item => item.id).filter(id => typeof id === 'string' && /^[a-zA-Z0-9_.\/-]{1,100}$/.test(id));
            console.log(JSON.stringify({ models: ids }));
          })().catch(() => { console.error('Catalog request failed'); process.exitCode = 1; });
          NODE
